<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colombia Makes Money | Rutas</title>
    <link rel="icon" href="../Imagenes/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="../JavaScript/tema.js"></script>
</head>

<body class="bg-crema-100 text-cafe-900 font-sans min-h-screen flex flex-col">
    <header id="app-nav"></header>

    <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-14">
        <h1 class="text-4xl font-bold mb-2">Buscador de rutas</h1>
        <p class="text-cafe-700 mb-8">Escribe un tema o una duda (por ejemplo "tarjeta de crédito", "TRM" o "CDT") y te mostramos el camino de estudio recomendado.</p>

        <!-- <form> en vez de un botón suelto: Enter también busca y es más accesible -->
        <form id="form-buscar" class="bg-crema-50 border border-crema-300 p-6 sm:p-8 rounded-3xl shadow-xl">
            <label for="input-tema" class="block mb-2 font-semibold">¿Qué quieres aprender?</label>
            <input type="text" id="input-tema" autocomplete="off"
                placeholder="Ejemplo: ahorro, deudas, inversión, tasa de cambio..."
                class="w-full px-4 py-3 rounded-xl bg-white border border-crema-300 text-cafe-900 placeholder:text-cafe-500 focus:outline-none focus:ring-4 focus:ring-amarillo-300 mb-4" />

            <label for="select-nivel" class="block mb-2 font-semibold">¿Desde qué nivel empiezas?</label>
            <select id="select-nivel"
                class="w-full px-4 py-3 rounded-xl bg-white border border-crema-300 text-cafe-900 focus:outline-none focus:ring-4 focus:ring-amarillo-300 mb-6">
                <option value="">Desde el principio (Básico)</option>
                <option value="Intermedio">Ya sé lo básico (Intermedio)</option>
                <option value="Avanzado">Solo lo avanzado</option>
            </select>

            <button type="submit"
                class="w-full bg-amarillo-400 hover:bg-amarillo-500 py-3 rounded-xl font-semibold shadow-md transition">
                Buscar ruta
            </button>

            <p class="text-sm text-cafe-500 mt-6 mb-2">O elige un tema:</p>
            <div id="sugerencias" class="flex flex-wrap gap-2"></div>
        </form>

        <section id="resultados-ruta" aria-live="polite" class="mt-10"></section>
    </main>

    <footer id="app-footer"></footer>

    <!-- Orden importa: estructura → datos → interfaz -->
    <script src="../JavaScript/Nodos.js"></script>
    <script src="../JavaScript/rutas-datos.js"></script>
    <script src="../JavaScript/buscador.js"></script>
    <script src="../JavaScript/layout.js"></script>
</body>
</html>

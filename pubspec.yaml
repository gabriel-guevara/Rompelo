name: rompelo_app
description: "Aplicación móvil nativa de minijuegos de rompehielo para grupos en dispositivo compartido - Rómpelo."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.3
  sensors_plus: ^7.1.1
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.2
  shared_preferences: ^2.5.6
  flutter_svg: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icono de la app a partir del logo del equipo (assets/branding/logo.svg →
# PNG). Para regenerarlo: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#991C2B"
  adaptive_icon_foreground: assets/branding/icon.png
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    # Efectos generados con `dart run tool/generate_sounds.dart`.
    - assets/sounds/
    # Logo y nombre de Rómpelo (diseño del equipo).
    - assets/branding/logo.svg
    - assets/branding/wordmark.svg

  # Fuente Outfit empaquetada (RNF offline: no se descarga en runtime).
  # google/fonts solo publica el TTF variable (eje wght 100–900); los pesos se
  # seleccionan con FontVariation.weight en AppTheme (ver app_theme.dart).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf

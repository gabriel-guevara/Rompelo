name: rompelo_app
description: "Aplicación móvil nativa de minijuegos de rompehielo para grupos en dispositivo compartido - Rómpelo."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fuente Outfit empaquetada (RNF offline: no se descarga en runtime).
  # google/fonts solo publica el TTF variable (eje wght 100–900); los pesos se
  # seleccionan con FontVariation.weight en AppTheme (ver app_theme.dart).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
